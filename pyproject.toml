[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "article-to-audio-digest"
version = "1.0.0"
description = "Extract an article body and create a spoken MP3 digest."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31", "trafilatura>=1.8", "gTTS>=2.5", "pydub>=0.25"]

[tool.setuptools.packages.find]
where = ["."]
include = ["article_to_audio*"]
